<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUBE · 榜单管理</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-page"><header><a class="brand" href="/">CUBE <span>↗</span></a><span>榜单管理</span></header><main class="admin-workspace"><div id="admin-status" role="status">正在验证账号…</div><a id="admin-signin" hidden class="mail-action" href="/signin-with-chatgpt?return_to=%2Fadmin" target="_top">登录站点所有者账号</a>
<section id="admin-content" hidden><div class="board-tabs" role="group" aria-label="榜单组别"><button data-admin-mode="traditional">传统比赛组</button><button data-admin-mode="full">完全计时组</button></div><p class="admin-note">每组最多 20 条，按耗时从短到长排序。请审核完整录屏后录入。</p><form id="entry-form"><label>挑战者 / 模型<input id="entry-name" required maxlength="64" autocomplete="off"></label><label>耗时（秒）<input id="entry-time" required type="number" min="0.001" max="86400" step="0.001"></label><label>步数<input id="entry-moves" required type="number" min="0" step="1" value="0"></label><div class="form-actions"><button class="primary" id="entry-save" type="submit">添加成绩</button><button id="entry-cancel" type="button" hidden>取消编辑</button></div></form><div class="board-scroll"><table><thead><tr><th>#</th><th>挑战者 / 模型</th><th>耗时</th><th>步数</th><th>操作</th></tr></thead><tbody id="admin-rows"></tbody></table></div></section></main><script type="module" src="/admin.js"></script></body></html>
